version: '3.8'

services:
  # MongoDB Database
  db:
    image: mongo:latest
    container_name: travel-journal-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: travel-journal
    networks:
      - travel-journal-network

  # Express Backend
  backend:
    build: ./backend
    container_name: travel-journal-backend
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      MONGODB_URI: mongodb://db:27017/travel-journal
      NODE_ENV: development
      PORT: 5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - travel-journal-network
    command: npm run dev

  # React Frontend
  frontend:
    build: ./frontend
    container_name: travel-journal-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - travel-journal-network
    command: npm start

volumes:
  mongodb_data:

networks:
  travel-journal-network:
    driver: bridge
