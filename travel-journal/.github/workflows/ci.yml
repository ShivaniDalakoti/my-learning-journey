name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: travel-journal/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./travel-journal/backend
        run: npm install

      - name: Lint backend
        working-directory: ./travel-journal/backend
        run: npm run lint --if-present || true

      - name: Run backend tests
        working-directory: ./travel-journal/backend
        run: npm test --if-present || true

  frontend-tests:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: travel-journal/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./travel-journal/frontend
        run: npm install

      - name: Lint frontend
        working-directory: ./travel-journal/frontend
        run: npm run lint --if-present || true

      - name: Run frontend tests
        working-directory: ./travel-journal/frontend
        run: npm test --if-present --watchAll=false || true

      - name: Build frontend
        working-directory: ./travel-journal/frontend
        run: npm run build

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: ./travel-journal/backend
          push: false
          tags: travel-journal-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./travel-journal/frontend
          push: false
          tags: travel-journal-frontend:latest

  security-check:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug
